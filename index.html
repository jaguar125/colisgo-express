<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1C3F" />
    <link rel="manifest" href="/manifest.json" />
    <title>ColisGo-Express</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }
      * {
        box-sizing: border-box;
      }
      #landscape-block {
        display: none;
      }
      @media (orientation: landscape) {
        #root {
          display: none;
        }
        #landscape-block {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 99999;
          background: #0F1C3F;
          color: #fff;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 32px;
          font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #landscape-block svg {
          margin-bottom: 20px;
          animation: rotateHint 1.8s ease-in-out infinite;
        }
        #landscape-block h2 {
          margin: 0 0 10px;
          font-size: 1.15rem;
        }
        #landscape-block p {
          margin: 0;
          font-size: 0.9rem;
          color: #9AA6D6;
          max-width: 320px;
        }
        @keyframes rotateHint {
          0%, 100% { transform: rotate(0deg); }
          50% { transform: rotate(-90deg); }
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="landscape-block">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      <h2>Veuillez tourner votre appareil</h2>
      <p>ColisGo-Express est conçue pour une utilisation en mode portrait.</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
